<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://mzlklldgpnvepddkzoau.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_cMAUUlt9pxzHicf2o4U3WQ_vV4h3tvl';
const sb=window.supabase?.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const SHARED_ID='shared-courierpilot';
const READ_ONLY=new URLSearchParams(location.search).get('lecture')==='1';
const $=id=>document.getElementById(id);
const setText=(id,value)=>document.querySelectorAll('[id="'+id+'"]').forEach(el=>{el.textContent=value});
const money=n=>Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' zł';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
['courseDate','payoutDate','expenseDate','collectDate','collectViewDate','walletDate','walletViewDate'].forEach(id=>$(id).value=today());
$('walletWorkWeek').value='';
$('payoutWorkWeek').value='';

let state={courses:[],payouts:[],expenses:[],collects:[],wallet:[]};
let tab='day',signedIn=false,syncing=false,pollingRemote=false,remoteRowIds=[SHARED_ID];

try{state={...state,...JSON.parse(localStorage.getItem('cpdata')||'{}')}}catch(e){alert("Les données locales n'ont pas pu être lues. Ne clique pas sur Effacer les données.");}
['courses','payouts','expenses','collects','wallet'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]});
state.wallet=state.wallet.map(e=>({...e,workWeek:e.workWeek||(e.date?weekStart(e.date):today())}));
state.payouts=state.payouts.map(p=>({...p,workWeek:p.workWeek||(p.date?weekStart(p.date):today())}));

const v=id=>Math.max(0,Number($(id).value)||0);
const tax=()=>Math.min(100,v('taxRate'))/100;
const av=()=>Math.min(100,v('avalonRate'))/100;

function setStatus(s){$('syncStatus').textContent=s}
function authUI(on){
 signedIn=on;
 $('signIn').classList.toggle('hidden',on);
 $('signOut').classList.toggle('hidden',!on);
 $('authEmail').disabled=on;
 $('authPassword').disabled=on;
 setStatus(on?'Connecté. Vérification de la synchronisation…':'Déconnecté. Les données locales restent enregistrées.');
 if(READ_ONLY)lockReadOnly();
}
function lockReadOnly(){
 $('readOnlyNote').classList.remove('hidden');
 document.querySelectorAll('button').forEach(b=>{
  if(!['signIn','signOut','export'].includes(b.id)&&!b.hasAttribute('data-tab'))b.disabled=true;
 });
 document.querySelectorAll('input,select').forEach(el=>{
  if(!['authEmail','authPassword','collectViewDate','walletViewDate'].includes(el.id))el.disabled=true;
 });
 $('importBtn').classList.add('hidden');
 $('clear').classList.add('hidden');
}
function weekStart(s){
 const d=new Date(s+'T12:00:00');
 d.setDate(d.getDate()-(d.getDay()+6)%7);
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function gross(a){return a.reduce((s,c)=>s+Number(c.amount||0)+Number(c.tip||0),0)}
function localSave(){try{localStorage.setItem('cpdata',JSON.stringify(state))}catch(e){alert("Impossible d'enregistrer les données. Vérifie l'espace disponible dans le navigateur.")}}
function snapshot(){return {courses:state.courses,payouts:state.payouts,expenses:state.expenses,collects:state.collects,wallet:state.wallet,settings:{taxRate:v('taxRate'),avalonRate:v('avalonRate')}}}
function applySnapshot(d){
 if(!d||typeof d!=='object')throw Error('Sauvegarde distante invalide');
 for(const k of ['courses','payouts','expenses','collects','wallet'])if(d[k]!==undefined&&!Array.isArray(d[k]))throw Error('Historique invalide');
 state={courses:Array.isArray(d.courses)?d.courses:[],payouts:Array.isArray(d.payouts)?d.payouts:[],expenses:Array.isArray(d.expenses)?d.expenses:[],collects:Array.isArray(d.collects)?d.collects:[],wallet:Array.isArray(d.wallet)?d.wallet:[]};
 if(d.settings){$('taxRate').value=d.settings.taxRate??28.38;$('avalonRate').value=d.settings.avalonRate??0}
 localSave();
 render();
}
function hasRecords(d){return ['courses','payouts','expenses','collects','wallet'].some(k=>Array.isArray(d?.[k])&&d[k].length)}
function mergeArrays(local,remote){
 const out=[],seen=new Set();
 for(const item of [...(Array.isArray(local)?local:[]),...(Array.isArray(remote)?remote:[])]){
  const key=JSON.stringify(item);
  if(!seen.has(key)){seen.add(key);out.push(item)}
 }
 return out;
}
function isSnapshot(d){return !!d&&typeof d==='object'&&['courses','payouts','expenses','collects','wallet'].some(k=>Array.isArray(d[k]))}
async function readRemoteRows(){
 const {data,error}=await sb.from('courierpilot_data').select('id,data,updated_at');
 if(error)throw error;
 return (data||[]).filter(r=>isSnapshot(r.data));
}
function mergeRemoteRows(rows){
 const out={courses:[],payouts:[],expenses:[],collects:[],wallet:[],settings:null};
 for(const k of ['courses','payouts','expenses','collects','wallet'])out[k]=mergeArrays([],rows.flatMap(r=>Array.isArray(r.data?.[k])?r.data[k]:[]));
 const preferred=rows.find(r=>r.id==='shared')||rows.find(r=>r.id===SHARED_ID)||rows[0];
 remoteRowIds=[...new Set(rows.map(r=>r.id).filter(Boolean))];
 if(preferred&&!remoteRowIds.includes(preferred.id))remoteRowIds.push(preferred.id);
 if(!remoteRowIds.length)remoteRowIds=[SHARED_ID];
 const withSettings=[...rows].reverse().find(r=>r.data?.settings);
 out.settings=withSettings?.data?.settings||null;
 return out;
}
async function pushRemote(){
 if(!signedIn||!sb||syncing||READ_ONLY)return;
 syncing=true;
 try{
  const rows=await readRemoteRows();
  if(rows.length)remoteRowIds=[...new Set(rows.map(r=>r.id))];
  if(!remoteRowIds.length)remoteRowIds=[SHARED_ID];
  const payload=snapshot();
  const records=remoteRowIds.map(id=>({id,data:payload,updated_at:new Date().toISOString()}));
  const {error}=await sb.from('courierpilot_data').upsert(records,{onConflict:'id'});
  if(error)throw error;
  setStatus('Synchronisé ✓ Les données sont sur Supabase.');
 }catch(e){setStatus('Échec de synchronisation : '+e.message+'. Les données locales sont conservées.')}
 finally{syncing=false}
}
async function pullRemote(){
 if(!signedIn||!sb)return;
 try{
  const rows=await readRemoteRows();
  if(READ_ONLY){
   if(!rows.length){setStatus('Connecté en consultation. Aucune sauvegarde partagée trouvée.');return}
   applySnapshot(mergeRemoteRows(rows));
   lockReadOnly();
   setStatus('Consultation synchronisée ✓ Mise à jour automatique active.');
   return;
  }
  if(!rows.length){
   remoteRowIds=[SHARED_ID];
   if(hasRecords(state))await pushRemote();
   else setStatus('Connecté. La base partagée est vide.');
   return;
  }
  const remote=mergeRemoteRows(rows),local=snapshot(),merged={...remote};
  for(const k of ['courses','payouts','expenses','collects','wallet'])merged[k]=mergeArrays(local[k],remote[k]);
  merged.settings=local.settings||remote.settings;
  applySnapshot(merged);
  await pushRemote();
  setStatus('Synchronisé ✓ Historique local et partagé réunis.');
 }catch(e){setStatus('Lecture Supabase impossible : '+e.message+'. Données locales conservées.')}
}
$('signIn').onclick=async()=>{
 if(!sb){setStatus('Connexion Supabase indisponible. Vérifie Internet.');return}
 const email=$('authEmail').value.trim(),password=$('authPassword').value;
 if(!email||!password){setStatus('Saisis l’e-mail et le mot de passe du compte partagé.');return}
 $('signIn').disabled=true;
 setStatus('Connexion…');
 try{
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error)throw error;
  authUI(true);
  await pullRemote();
 }catch(e){setStatus('Connexion impossible : '+e.message)}
 finally{$('signIn').disabled=false;if(READ_ONLY)lockReadOnly()}
};
$('signOut').onclick=async()=>{if(sb)await sb.auth.signOut();authUI(false)};
if(READ_ONLY)lockReadOnly();

setInterval(async()=>{
 if(signedIn&&READ_ONLY&&!pollingRemote){
  pollingRemote=true;
  try{await pullRemote()}finally{pollingRemote=false}
 }
},10000);
if(sb)sb.auth.getSession().then(async({data})=>{if(data.session){authUI(true);await pullRemote()}});

function persist(){
 if(READ_ONLY){setStatus('Mode consultation : aucune modification autorisée.');return}
 localSave();
 render();
 if(signedIn)pushRemote();
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateValue(id){return $(id).value||today()}

function render(){
 const t=today(),w=weekStart(t);
 const day=state.courses.filter(c=>c.date===t);
 const week=state.courses.filter(c=>c.date&&weekStart(c.date)===w);
 const all=tab==='day'?day:tab==='week'?week:state.courses;
 const g=gross(all),ded=g*(tax()+av());
 const sum=arr=>arr.reduce((s,x)=>s+Number(x.amount||0),0);
 const net=arr=>gross(arr)*(1-tax()-av());
 const weekExpenses=state.expenses.filter(e=>e.date&&weekStart(e.date)===w);
 const weekWallet=state.wallet.filter(e=>(e.workWeek||(e.date?weekStart(e.date):''))===w);
 const weekPayouts=state.payouts.filter(p=>(p.workWeek||(p.date?weekStart(p.date):''))===w);

 $('todayGross').textContent=money(gross(day));
 $('todayNet').textContent=money(net(day));
 $('todayCount').textContent=day.length+' course(s)';
 $('weekGross').textContent=money(gross(week));
 $('weekNet').textContent=money(net(week));
 $('weekCount').textContent=week.length+' course(s)';

 $('periodCount').textContent=all.length;
 $('periodGross').textContent=money(g);
 $('periodTax').textContent='− '+money(ded);
 $('periodNet').textContent=money(g-ded);

 const cg=v('courseAmount')+v('tip');
 $('courseGross').textContent=money(cg);
 $('courseTax').textContent='− '+money(cg*(tax()+av()));
 $('courseNet').textContent=money(cg*(1-tax()-av()));
 $('expenseTotal').textContent=money(sum(state.expenses));

 const cd=dateValue('collectViewDate'),wd=dateValue('walletViewDate');
 const dc=state.collects.filter(c=>c.date===cd),dw=state.wallet.filter(e=>e.date===wd);
 $('collectDayDue').textContent=money(dc.reduce((s,c)=>s+Number(c.due||0),0));
 $('collectDayReceived').textContent=money(dc.reduce((s,c)=>s+Number(c.received||0),0));
 $('collectAll').textContent=money(dc.reduce((s,c)=>s+Number(c.received||0),0));
 $('collectGrandTotal').textContent=money(state.collects.reduce((s,c)=>s+Number(c.received||0),0));
 $('walletDayTotal').textContent=money(sum(dw));
 $('walletAllTotal').textContent=money(sum(state.wallet));

 setText('financeWeekGross',money(gross(week)));
 setText('financeWeekTax','− '+money(gross(week)*(tax()+av())));
 setText('financeWeekNet',money(net(week)));
 setText('financeWeekExpenses','− '+money(sum(weekExpenses)));
 setText('financeWeekAfterExpenses',money(net(week)-sum(weekExpenses)));
 setText('financeWeekWallet',money(sum(weekWallet)));
 setText('financeWeekWalletGap',money(Math.max(0,net(week)-sum(weekWallet))));
 setText('walletGapFormula',money(net(week))+' − '+money(sum(weekWallet)));
 setText('financeWeekPayouts',money(sum(weekPayouts)));
 setText('avalonWeekCaption',weekPayouts.length?'Semaine de travail : '+w:'Semaine de travail à préciser');

 const workWeeks=[...new Set([
  ...state.courses.map(c=>c.date?weekStart(c.date):''),
  ...state.wallet.map(e=>e.workWeek||(e.date?weekStart(e.date):'')),
  ...state.payouts.map(p=>p.workWeek||(p.date?weekStart(p.date):''))
 ].filter(Boolean))].sort((a,b)=>b.localeCompare(a));

 $('workPeriods').innerHTML=workWeeks.length?workWeeks.map(ww=>{
   const courses=state.courses.filter(c=>c.date&&weekStart(c.date)===ww);
   const wallets=state.wallet.filter(e=>(e.workWeek||(e.date?weekStart(e.date):''))===ww);
   const payouts=state.payouts.filter(p=>(p.workWeek||(p.date?weekStart(p.date):''))===ww);
   const grossWeek=gross(courses),netWeek=net(courses);
   return `<div class="period-line"><span>Semaine travaillée · ${esc(ww)}</span><b>${money(grossWeek)} brut</b></div><div class="period-line"><span>Net estimé</span><b class="green">${money(netWeek)}</b></div><div class="period-line"><span>Glovo encaissé</span><b>${money(sum(wallets))}</b></div><div class="period-line"><span>Virement Avalon reçu</span><b>${money(sum(payouts))}</b></div>`;
 }).join(''):'<div class="empty">Aucune semaine de travail enregistrée.</div>';

 setText('financeAllNet',money(net(state.courses)));
 setText('financeAllExpenses',money(sum(state.expenses)));
 setText('financeAllAfterExpenses',money(net(state.courses)-sum(state.expenses)));
 setText('financeAllWallet',money(sum(state.wallet)));
 setText('financeAllPayouts',money(sum(state.payouts)));
 setText('financeAvailable',money(sum(state.payouts)-sum(state.expenses)));

 const cr=state.collects.map((c,i)=>({...c,_index:i})).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 $('collectHistory').innerHTML=cr.length?cr.map(c=>`<div class="row"><span><b>${esc(c.date)}</b><br>Demandé : ${money(c.due)} · Reçu : ${money(c.received)}<br>Écart : ${money(Math.max(0,Number(c.due||0)-Number(c.received||0)))}</span><button class="danger" data-delete-collect="${c._index}">Supprimer</button></div>`).join(''):'<div class="empty">Aucune collecte enregistrée.</div>';

 const wr=state.wallet.map((e,i)=>({...e,_index:i})).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 $('walletHistory').innerHTML=wr.length?wr.map(e=>`<div class="row"><span><b>${esc(e.date)}</b><br>Encaissement : ${money(e.amount)}<br>Semaine de travail : ${esc(e.workWeek||weekStart(e.date))}</span><button class="danger" data-delete-wallet="${e._index}">Supprimer</button></div>`).join(''):'<div class="empty">Aucun encaissement enregistré.</div>';

 const items=[
 ...state.courses.map((c,i)=>({date:c.date,title:'Course · '+c.platform,detail:'Brut '+money(Number(c.amount||0)+Number(c.tip||0)),amount:Number(c.amount||0)+Number(c.tip||0),kind:'course',index:i})),
 ...state.payouts.map((p,i)=>({date:p.date,title:'Virement net Avalon',detail:'Reçu le '+p.date+' · semaine travaillée '+(p.workWeek||weekStart(p.date))+' · déjà net',amount:Number(p.amount||0),kind:'payout',index:i})),
 ...state.expenses.map((e,i)=>({date:e.date,title:'Dépense · '+e.type,detail:'Dépense',amount:-Number(e.amount||0),kind:'expense',index:i})),
 ...state.collects.map((c,i)=>({date:c.date,title:'Collecte client',detail:'Demandé '+money(c.due)+' · reçu '+money(c.received),amount:0,kind:'collect',index:i})),
 ...state.wallet.map((e,i)=>({date:e.date,title:'Encaissement portefeuille Glovo',detail:'Suivi séparé',amount:0,kind:'wallet',index:i}))
 ].sort((a,b)=>String(b.date).localeCompare(String(a.date)));

 $('history').innerHTML=items.length?items.map(x=>`<div class="row"><span><b>${esc(x.title)}</b><br>${esc(x.date)} · ${esc(x.detail)}</span><span style="text-align:right"><b class="${x.amount<0?'red':''}">${x.amount<0?'− ':''}${money(Math.abs(x.amount))}</b><br><button class="danger" data-delete-kind="${x.kind}" data-delete-index="${x.index}">Supprimer</button></span></div>`).join(''):'<div class="empty">Aucune opération pour le moment.</div>';
 $('collectGap').textContent=money(Math.max(0,v('collectDue')-v('collectReceived')));
}

$('addCourse').onclick=()=>{
 const amount=v('courseAmount'),tip=v('tip');
 if(amount+tip<=0)return alert('Saisis un montant de course.');
 state.courses.push({date:dateValue('courseDate'),platform:$('platform').value,amount,tip});
 persist();$('courseAmount').value='';$('tip').value='0';
};
$('addCollect').onclick=()=>{
 const due=v('collectDue'),received=v('collectReceived');
 if(due<=0)return alert('Saisis le montant demandé.');
 if(received>due)return alert('Le montant reçu ne peut pas dépasser le montant demandé.');
 state.collects.push({date:dateValue('collectDate'),due,received});
 persist();$('collectDue').value='';$('collectReceived').value='0';
};
$('addWallet').onclick=()=>{
 const amount=v('walletAmount'),workWeek=$('walletWorkWeek').value;
 if(amount<=0)return alert('Saisis le montant encaissé.');
 if(!workWeek)return alert('Choisis le lundi de la semaine de travail concernée.');
 state.wallet.push({date:dateValue('walletDate'),workWeek:weekStart(workWeek),amount});
 persist();$('walletAmount').value='';
};
$('addPayout').onclick=()=>{
 const amount=v('payoutAmount'),workWeek=$('payoutWorkWeek').value;
 if(amount<=0)return alert('Saisis le montant net reçu.');
 if(!workWeek)return alert('Choisis le lundi de la semaine de travail rémunérée.');
 state.payouts.push({date:dateValue('payoutDate'),workWeek:weekStart(workWeek),amount});
 persist();$('payoutAmount').value='';
};
$('addExpense').onclick=()=>{
 const amount=v('expenseAmount');
 if(amount<=0)return alert('Saisis le montant de la dépense.');
 state.expenses.push({date:dateValue('expenseDate'),type:$('expenseType').value,amount});
 persist();$('expenseAmount').value='';
};

function deleteOperation(kind,index){
 if(READ_ONLY)return;
 const map={course:'courses',payout:'payouts',expense:'expenses',collect:'collects',wallet:'wallet'},key=map[kind];
 if(!key||!state[key][index])return;
 if(!confirm('Supprimer cette opération ?'))return;
 state[key].splice(index,1);persist();
}
document.addEventListener('click',e=>{
 const c=e.target.closest('[data-delete-collect]');
 if(c){deleteOperation('collect',Number(c.dataset.deleteCollect));return}
 const w=e.target.closest('[data-delete-wallet]');
 if(w){deleteOperation('wallet',Number(w.dataset.deleteWallet));return}
 const b=e.target.closest('[data-delete-kind]');
 if(b)deleteOperation(b.dataset.deleteKind,Number(b.dataset.deleteIndex));
});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
 tab=b.dataset.tab;
 document.querySelectorAll('[data-tab]').forEach(x=>x.className=x===b?'':'secondary');
 render();
});
['courseAmount','tip','taxRate','avalonRate','collectDue','collectReceived'].forEach(id=>$(id).addEventListener('input',render));
['collectViewDate','walletViewDate'].forEach(id=>$(id).addEventListener('change',render));

$('export').onclick=()=>{
 const backup={app:'CourierPilot',version:3,exportedAt:new Date().toISOString(),...snapshot()};
 const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json;charset=utf-8'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='courierpilot-sauvegarde.json';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),2000);
};
$('importBtn').onclick=()=>{if(!READ_ONLY)$('importFile').click()};
$('importFile').onchange=async e=>{
 const file=e.target.files&&e.target.files[0];if(!file)return;
 try{
  const s=JSON.parse(await file.text());
  for(const k of ['courses','payouts','expenses','collects','wallet'])if(s[k]!==undefined&&!Array.isArray(s[k]))throw Error('Format invalide');
  if(!confirm('Importer cette sauvegarde et remplacer les données affichées ?'))return;
  state={courses:s.courses||[],payouts:s.payouts||[],expenses:s.expenses||[],collects:s.collects||[],wallet:s.wallet||[]};
  if(s.settings){$('taxRate').value=s.settings.taxRate??28.38;$('avalonRate').value=s.settings.avalonRate??0}
  persist();alert('Sauvegarde importée.');
 }catch(err){alert('Fichier invalide. Aucune donnée importée.')}
 finally{e.target.value=''}
};
$('clear').onclick=()=>{
 if(READ_ONLY)return;
 if(confirm('Effacer toutes les données locales et synchronisées ? Cette action est irréversible sans sauvegarde.')){
  state={courses:[],payouts:[],expenses:[],collects:[],wallet:[]};persist();
 }
};
$('taxRate').addEventListener('change',()=>{if(READ_ONLY)return;render();if(signedIn)pushRemote()});
$('avalonRate').addEventListener('change',()=>{if(READ_ONLY)return;render();if(signedIn)pushRemote()});
render();
</script>
</body>
</html>
